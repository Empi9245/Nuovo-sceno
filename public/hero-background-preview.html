<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Background Grid - Scenografica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: oklch(17% 0.012 72);
            position: relative;
        }
        
        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                linear-gradient(90deg, rgba(240, 235, 230, 0.5) 1px, transparent 1px),
                linear-gradient(0deg, rgba(240, 235, 230, 0.5) 1px, transparent 1px);
            background-size: 80px 80px;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: oklch(94% 0.012 78);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            background: oklch(17% 0.012 72 / 0.8);
            padding: 12px 16px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
        }
        
        .info h1 {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .info p {
            margin: 4px 0;
            opacity: 0.8;
        }
        
        .download-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: oklch(63% 0.145 49);
            color: oklch(17% 0.012 72);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        
        .download-btn:hover {
            background: oklch(68% 0.145 49);
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    
    <div class="info">
        <h1>Hero Background Grid</h1>
        <p><strong>Colore base:</strong> oklch(17% 0.012 72)</p>
        <p><strong>Griglia:</strong> 80x80px</p>
        <p><strong>Opacità griglia:</strong> 0.35</p>
        <button class="download-btn" onclick="downloadAsSVG()">Scarica SVG</button>
    </div>
    
    <script>
        function downloadAsSVG() {
            // Apri il file SVG in una nuova finestra
            window.open('/images/hero-background-grid.svg', '_blank');
        }
    </script>
</body>
</html>
